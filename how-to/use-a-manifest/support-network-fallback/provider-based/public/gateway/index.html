<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Support network fallback - gateway</title>
		<link rel="stylesheet" href="./gateway.css" />
		<script src="../js/gateway.bundle.js"></script>
	</head>
	<body>
		<section id="unavailable" hidden>
			<h1>Support Network Fallback cannot start</h1>
			<p>
				Neither app.example.internal nor app.example.com can be reached. Check your network, then try again.
			</p>
			<div class="buttons">
				<button id="close">Close</button>
				<button id="retry" class="primary">Retry</button>
			</div>
		</section>
		<p id="status">Choosing a route...</p>
	</body>
</html>
