<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Custom View Tab Headers</title>
		<link rel="stylesheet" href="../styles/platform-window.css" />
		<script src="../js/platform-window.bundle.js"></script>
	</head>
	<body>
		<header class="example-header">
			<div>
				<strong>Custom view tab headers</strong>
				<span>Use the star and info controls with a mouse or keyboard.</span>
			</div>
			<output id="status" aria-live="polite">Choose a tab control.</output>
		</header>
		<div id="layout-bootstrap" hidden></div>
		<main id="layout-container"></main>
	</body>
</html>
